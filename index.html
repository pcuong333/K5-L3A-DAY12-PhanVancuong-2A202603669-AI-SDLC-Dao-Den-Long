<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10172d" />
    <title>Đảo Đèn Lồng</title>
  </head>
  <body>
    <main id="game">
      <div id="hud" aria-live="polite" hidden>
        <header class="hud-top">
          <div class="stat flames-stat"><span>NGỌN LỬA</span><strong id="flames">✦ ✦ ✦</strong></div>
          <div class="night-label"><strong>ĐẢO ĐÈN LỒNG</strong><span id="night-title">ĐÊM 1 · ĐẢO BẾN</span></div>
          <time class="timer" id="time">05:00</time>
          <div class="stat"><span>ĐÈN</span><strong id="lanterns">0 / 5</strong></div>
          <div class="stat"><span>ĐIỂM</span><strong id="score">0</strong></div>
        </header>
        <div class="hud-bottom">
          <div class="mote-panel"><span>ĐOM ĐÓM</span><div id="carry-slots" aria-label="Đom đóm đang mang"></div></div>
          <div class="ability-panel">
            <div class="ability"><kbd>Shift</kbd><span id="dash-cooldown">LƯỚT —</span></div>
            <div class="ability"><kbd>Q</kbd><span id="pulse-cooldown">TỎA SÁNG —</span></div>
          </div>
        </div>
        <div id="hint" class="interaction-hint" aria-live="polite"></div>
        <div id="wind-warning" class="wind-warning" hidden>GIÓ MẠNH SẮP ĐẾN</div>
        <div id="arrow" class="lantern-arrow" hidden><span>➤</span><small></small></div>
      </div>
      <section id="overlay" class="screen" aria-live="polite"></section>
      <div id="loading">Đang thắp sáng hòn đảo…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
